name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 단위 테스트 (tests/*.test.mjs). 백엔드가 필요한 test:integration은 넣지 않는다.
      - name: Unit test
        run: npm test

      # tsc -b 타입 체크 + vite build
      # 이 CI가 develop에서 통과하면 서버(zipfit.duckdns.org)가 2분 안에 가져가 배포한다 (Backend deploy/deploy-frontend.sh).
      - name: Type check & Build
        run: npm run build
